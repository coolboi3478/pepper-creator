<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="348" height="331" viewBox="0,0,348,331"><g transform="translate(29,-34)"><g stroke="none" stroke-miterlimit="10"><path d="M-29,267v-233h348v233z" fill="#ff7a54" stroke-width="0"/><text transform="translate(-20,56) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#e40500" stroke-width="1" font-family="Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">HOW TO PEPPER</tspan></text><text transform="translate(-23,77.31782) scale(0.39362,0.39362)" font-size="40" xml:space="preserve" fill="#e40500" stroke-width="1" font-family="Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">clicking base, eyes, or extra will change the part of </tspan><tspan x="0" dy="46.15px">your pepper you are editing. the circle with a picture</tspan><tspan x="0" dy="46.15px">on it will change the part to the pic (this also resets</tspan><tspan x="0" dy="46.15px">color, angle, size, and placement, aswell as gets rid</tspan><tspan x="0" dy="46.15px">of your custom image.) the arrows next to it will</tspan><tspan x="0" dy="46.15px">cycle through the presets. the upload image button</tspan><tspan x="0" dy="46.15px">will change the part to your png or jpg. DRAGGING</tspan><tspan x="0" dy="46.15px">IS SEMI WEIRD SO LISTEN UP, each part is linked</tspan><tspan x="0" dy="46.15px">to a key, pressing it will make it go to your mouse.</tspan><tspan x="0" dy="46.15px">Q is linked to base, A is linked to eyes, and Z is </tspan><tspan x="0" dy="46.15px">linked to extra. </tspan></text><path d="M133,365v-102h186v102z" fill="#ff7a54" stroke-width="0"/><text transform="translate(137,282.9212) scale(0.3104,0.3104)" font-size="40" xml:space="preserve" fill="#e40500" stroke-width="1" font-family="Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">WHEN YOU ARE DONE, PRESS</tspan><tspan x="0" dy="46.15px">THE DONE BUTTON TO HIDE</tspan><tspan x="0" dy="46.15px">TOOLS, THAN SCREENSHOT</tspan><tspan x="0" dy="46.15px">YOUR PEPPER. hit back to start </tspan><tspan x="0" dy="46.15px">editing again</tspan></text></g></g></svg>